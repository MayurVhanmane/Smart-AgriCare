<!doctype html>
<html lang="{{ current_language if current_language in ['mr', 'hi'] else 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#183d2b">
    <meta name="description" content="{{ t('Practical crop, fertilizer and plant health recommendations for more confident farming.') }}">
    <title>{{ t(title or 'Smart AgriCare') }}</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/font-awesome.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Thasadith:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar navbar-expand-md container site-nav" aria-label="{{ t('Main navigation') }}">
        <a class="brand" href="{{ url_for('home') }}">
          <span class="brand-mark" aria-hidden="true">A</span>
          <span>{{ t('Smart AgriCare') }}</span>
        </a>
        <button class="nav-toggle" type="button" aria-label="{{ t('Toggle navigation') }}" aria-expanded="false" data-nav-toggle>
          <span aria-hidden="true">&#9776;</span>
        </button>
        <div class="nav-links ml-auto" data-nav-links>
          <a class="nav-link{% if request.endpoint == 'home' %} active{% endif %}" href="{{ url_for('home') }}">{{ t('Home') }}</a>
          <a class="nav-link{% if request.endpoint in ['crop_recommend', 'crop_prediction'] %} active{% endif %}" href="{{ url_for('crop_recommend') }}">{{ t('Crop advice') }}</a>
          <a class="nav-link{% if request.endpoint in ['fertilizer_recommendation', 'fert_recommend'] %} active{% endif %}" href="{{ url_for('fertilizer_recommendation') }}">{{ t('Fertilizer') }}</a>
          <a class="nav-link nav-cta{% if request.endpoint == 'disease_prediction' %} active{% endif %}" href="{{ url_for('disease_prediction') }}">{{ t('Plant health') }}</a>
          <form class="language-form" method="post" action="{{ url_for('set_language') }}" data-language-form>
            <input type="hidden" name="next" value="{{ request.full_path if request.query_string else request.path }}">
            <label class="sr-only" for="language">{{ t('Language') }}</label>
            <select id="language" name="language" aria-label="{{ t('Language') }}" data-language-select>
              <option value="en" {% if current_language == 'en' %}selected{% endif %}>English</option>
              <option value="mr" {% if current_language == 'mr' %}selected{% endif %}>मराठी</option>
              <option value="hi" {% if current_language == 'hi' %}selected{% endif %}>हिन्दी</option>
            </select>
          </form>
        </div>
      </nav>
    </header>

    <main class="page-shell">
      {% block body %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="footer-brand">{{ t('Smart AgriCare') }}</div>
      <p>{{ t('Practical insights for healthier crops and more confident farming.') }}</p>
      <p>&copy; MGM 2026-27</p>
    </footer>
    <script src="{{ url_for('static', filename='scripts/app.js', v=4) }}" defer></script>
  </body>
</html>
